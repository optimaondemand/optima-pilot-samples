<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Great Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: slim title rule across the top, ink-on-vellum map stage (lobby -> wing -> week plan) left, quest log right; stacks on phones.
   Deliberate single light look: a hand-inked map in the manner of a fantasy-novel endpaper, dark ink, one red accent, gold hairlines. */
:root{
  --page:#e6dbc0; --vellum:#f6efdc; --map:#f2e8cf; --ink:#2b2418; --ink-soft:#6f604a;
  --rule:#cbb98f; --red:#8f2a1c; --red-deep:#6e1f14; --gold:#a8842c; --green:#4f6b3a;
  --f-title:'Cinzel', 'Trajan Pro', Georgia, serif;
  --f-map:'IM Fell English SC', Georgia, 'Times New Roman', serif;
  --f-ital:'IM Fell English', Georgia, 'Times New Roman', serif;
  --f-body:'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:radial-gradient(1400px 700px at 50% -20%, #f1e8d0 0%, transparent 70%), var(--page);
  color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 44px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid;gap:18px}

/* title rule */
.hud{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 34px;padding-bottom:14px;border-bottom:3px double var(--rule)}
.brand{margin-right:auto;min-width:0}
.brand h1{margin:0;font-family:var(--f-title);font-weight:600;font-size:clamp(26px,3.6vw,36px);letter-spacing:.14em;line-height:1.05;text-wrap:balance}
.brand small{display:block;font-family:var(--f-ital);font-style:italic;font-size:17px;color:var(--ink-soft);margin-top:2px}
.stats{display:flex;flex-wrap:wrap;gap:12px 28px}
.stat{min-width:130px}
.stat .k{font-family:var(--f-title);font-size:10px;letter-spacing:.2em;color:var(--ink-soft)}
.stat .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:3px;background:#d9cba6;margin-top:4px}
.bar i{display:block;height:100%;background:var(--red)}
.bar.ink i{background:var(--ink)}
.bar.gold i{background:var(--gold)}
.player{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:var(--map);color:var(--ink);
  font-family:var(--f-title);font-size:18px;box-shadow:0 0 0 2px var(--vellum),0 0 0 3px var(--gold)}
.player .nm{font-weight:600;font-size:15px;line-height:1.2}
.player .rk{font-family:var(--f-ital);font-style:italic;font-size:14px;color:var(--ink-soft)}

/* game */
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,370px);gap:18px;align-items:start}
@media (max-width:940px){.game{grid-template-columns:minmax(0,1fr)}}
.frame,.card{background:var(--vellum);border:1px solid var(--rule);border-radius:8px;box-shadow:0 14px 30px -22px #4a361466;min-width:0}
.frame{padding:10px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:2px 4px 10px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--f-title);font-size:11px;letter-spacing:.18em;color:var(--ink-soft);margin-right:auto}
.crumbs button{all:unset;cursor:pointer;color:var(--red)}
.crumbs button:hover{text-decoration:underline;text-underline-offset:3px}
.crumbs button:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.crumbs .here{color:var(--ink)}
.btn{font-family:var(--f-title);font-size:11px;letter-spacing:.16em;cursor:pointer;background:transparent;color:var(--ink);
  border:1px solid var(--rule);border-radius:4px;padding:6px 12px}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.stage{position:relative;width:100%;aspect-ratio:1000/680;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--map)}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer-in{animation:layerIn .55s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 50%}
.layer-back{animation:layerBack .45s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 50%}
@keyframes layerIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes layerBack{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:none}}
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;padding:10px 6px 2px;font-family:var(--f-ital);font-style:italic;font-size:15px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend svg{flex:none}

/* svg type + states */
.t-map{font-family:var(--f-map)}
.t-ital{font-family:var(--f-ital);font-style:italic}
.t-cin{font-family:var(--f-title)}
.halo{paint-order:stroke;stroke:#f2e8cf;stroke-width:5px;stroke-linejoin:round}
.hit{cursor:pointer;outline:none}
.hit .ring{stroke:transparent}
.hit:hover .ring{stroke:#8f2a1c;stroke-opacity:.35}
.hit:focus-visible .ring{stroke:#8f2a1c;stroke-opacity:1}
.hit.kb .ring{stroke:#8f2a1c;stroke-opacity:1;stroke-width:2.2}
.walk{animation:walk 1.8s ease-in-out infinite;transform-box:fill-box}
@keyframes walk{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.travelers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.trav{font:inherit;cursor:pointer;background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 2px 5px;display:grid;justify-items:center;gap:2px;color:var(--ink);min-width:0}
.trav svg{width:100%;max-width:56px;height:auto;aspect-ratio:48/54}
.trav span{font-family:var(--f-map);font-size:13px;line-height:1.1}
.trav:hover{background:#efe4c7}
.trav[aria-pressed="true"]{border-color:var(--red);background:#efe4c7}
.trav:focus-visible{outline:2px solid var(--red);outline-offset:2px}
kbd{font-family:var(--f-title);font-style:normal;font-size:10px;letter-spacing:.08em;color:var(--ink);border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;padding:1px 5px;background:var(--vellum)}
.locked .lift{opacity:.42}
.pulse{animation:pulse 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
.march{animation:march 1.4s linear infinite}
@keyframes march{to{stroke-dashoffset:-26}}
.flag{animation:flag 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes flag{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.82)}}

/* side */
.side{display:grid;gap:18px;min-width:0}
.card{padding:18px}
.card h2{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-family:var(--f-title);font-weight:600;font-size:11px;letter-spacing:.24em;color:var(--ink-soft)}
.card h2::after{content:"";flex:1;height:1px;background:var(--rule)}
.guide{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:start}
.portrait{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--vellum);
  font-family:var(--f-title);font-size:22px;box-shadow:0 0 0 2px var(--vellum),0 0 0 3px var(--gold)}
.guide .who{font-family:var(--f-title);font-size:10px;letter-spacing:.24em;color:var(--red);margin-bottom:2px}
.guide .say{font-family:var(--f-ital);font-style:italic;font-size:18px;line-height:1.4}
.cta{display:block;width:100%;margin-top:16px;cursor:pointer;border:0;border-radius:5px;padding:12px 16px;text-align:left;
  background:var(--red);color:var(--vellum);font:inherit;box-shadow:inset 0 0 0 1px #c9a25a66}
.cta:hover{background:var(--red-deep)}
.cta:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.cta .k{display:block;font-family:var(--f-title);font-size:10px;letter-spacing:.22em;opacity:.85}
.cta .v{display:block;font-family:var(--f-map);font-size:24px;line-height:1.15}
.qhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.qhead .title{font-family:var(--f-map);font-size:26px;line-height:1.1}
.qhead .sub{font-family:var(--f-ital);font-style:italic;font-size:15px;color:var(--ink-soft);text-align:right}
.quests{list-style:none;margin:0;padding:0}
.q{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;cursor:pointer;text-align:left;
  font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid #e0d2ad;padding:10px 6px}
.q:hover{background:#efe4c7}
.q:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.q.sel{background:#ecdfbd}
.q .ic{color:var(--ink)}
.q .ic.canvas{color:var(--red)}
.q .ic.boss{color:var(--gold)}
.q .nm{display:block;font-weight:600;font-size:15px;line-height:1.25}
.q .mt{display:block;font-family:var(--f-ital);font-style:italic;font-size:14px;color:var(--ink-soft)}
.q.locked .nm,.q.locked .ic{opacity:.5}
.st{font-family:var(--f-title);font-size:9px;letter-spacing:.16em;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;border:1px solid currentColor}
.st.done{color:var(--green)} .st.done::before{background:currentColor}
.st.current{color:var(--red)} .st.current::before{background:currentColor;box-shadow:0 0 0 3px #8f2a1c33}
.st.due{color:var(--red)}
.st.open{color:var(--ink)}
.gap{height:10px;border-bottom:1px solid var(--rule)}
.seals{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.seal{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:1px dashed var(--rule);color:var(--rule)}
.seal.got{border:0;color:#f3dfc0;background:radial-gradient(circle at 38% 32%,#b2402c,#7b2216 70%);box-shadow:0 2px 0 #5a180f, inset 0 0 0 3px #00000022}
.seal svg{width:56%;height:56%}
.sealnames{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:6px;font-family:var(--f-map);font-size:12px;color:var(--ink-soft);text-align:center}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%) translateY(16px);
  max-width:min(92vw,520px);background:var(--vellum);color:var(--ink);border:1px solid var(--rule);border-top:3px solid var(--red);border-radius:6px;
  padding:10px 16px;box-shadow:0 14px 30px -14px #4a361488;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast b{font-family:var(--f-title);font-size:10px;letter-spacing:.22em;display:block;color:var(--red)}

/* lesson reader: full-screen, the week's four lessons as tabs */
.reader{position:fixed;inset:0;z-index:30;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--page);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.reader[hidden]{display:none}
.rbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:var(--vellum);border-bottom:3px double var(--rule)}
.rwhere{font-family:var(--f-title);font-size:11px;letter-spacing:.2em;color:var(--ink-soft);white-space:nowrap}
.rtabs{display:flex;gap:6px;flex:1 1 420px;min-width:0;overflow-x:auto;padding:2px}
.rtab{flex:none;display:flex;align-items:center;gap:8px;font:inherit;cursor:pointer;color:var(--ink);background:transparent;
  border:1px solid var(--rule);border-radius:5px;padding:5px 12px}
.rtab:hover{border-color:var(--ink)}
.rtab:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.rtab[aria-selected="true"]{background:var(--ink);color:var(--vellum);border-color:var(--ink)}
.rtab .n{font-family:var(--f-title);font-size:9px;letter-spacing:.18em;color:var(--red)}
.rtab[aria-selected="true"] .n{color:#e9b9a8}
.rtab .t{font-family:var(--f-map);font-size:16px;white-space:nowrap}
.rtrav{width:26px;height:26px;border-radius:50%;background:var(--map);flex:none}
.rnav{display:flex;gap:6px}
.btn:disabled{opacity:.4;cursor:default}
.rbody{position:relative;min-height:0}
.rbody iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}

@media (prefers-reduced-motion: reduce){ .pulse,.march,.flag,.walk,.layer-in,.layer-back{animation:none} }
</style>

<div class="wrap">
  <header class="hud">
    <div class="brand"><h1>THE GREAT LIBRARY</h1><small>Sixth Grade English Language Arts</small></div>

      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <div><div class="nm">Sample Scholar</div><div class="rk" id="rank">Week 12 of the journey</div></div>

  <main class="game">

      <div class="stage" id="stage">
        <svg id="world" viewBox="0 0 1000 680" role="group" aria-label="Library lobby"></svg>
        <svg id="wing" viewBox="0 0 1000 680" role="group" hidden></svg>
        <svg id="chamber" viewBox="0 0 1000 680" role="group" hidden></svg>
      </div>

        <span><svg width="18" height="18" style="color:var(--ink)"><use href="#s-door" width="18" height="18"/></svg>Rooms are lessons, read here</span>

           6:["The Knight's Gallery",'The Other Side',"The Writer's Bench",'A Good Knight']},
   files:{2:['lessons/w2-lesson1-the-promise.html','lessons/w2-lesson2-the-green-lace.html','lessons/w2-lesson3-writers-bench.html','lessons/w2-lesson4-what-the-castle-never-saw.html']}},
  {id:'robin',  name:'Sherwood',      book:'Robin Hood', weeks:8, x:770, y:475, sym:'s-robin',  land:'oak',     terr:'tree',

  {id:'bronze', name:'Galilee Hills', book:'The Bronze Bow', weeks:5, x:500, y:540, sym:'s-bronze', land:'village', terr:'hill',

function nodePositions(n){
  const pts=[]; for(let i=0;i<n;i++){ const row=Math.floor(i/4); let col=i%4; if(row%2) col=3-col; pts.push([180+col*215, 215+row*160]); } return pts;

function renderWing(mi){
  const m = MODS[mi], svg = document.getElementById('wing'), n = m.weeks+1, pts = nodePositions(n), rnd = seeded(mi*97+13);
  let terr='';

    const x=50+rnd()*900, y=130+rnd()*500;
    if (pts.some(p=>Math.hypot(p[0]-x,p[1]-y)<95)) continue;
    if (x>780 && y>540) continue;
    terr += `<g opacity=".7">${TERR[m.terr==='hill'&&k%3===0?'mt':m.terr](Math.round(x),Math.round(y))}</g>`;
  }
  const road = 'M'+pts.map(p=>p.join(' ')).join(' L');
  const curIdx = mi<CUR.m ? n-1 : mi===CUR.m ? CUR.w-1 : -1;
  const doneRoad = curIdx>0 ? 'M'+pts.slice(0,curIdx+1).map(p=>p.join(' ')).join(' L') : '';

  const gx = Math.min(140, x0-60), gw = Math.max(720, total+120);
  svg.innerHTML = `${parchment()}

/* ---------- side panel ---------- */
function questItems(mi, w){
  const m = MODS[mi], items = m.rooms.map((_,k)=>({kind:'lesson', id:'room-'+(k+1), title:roomName(mi,w,k), meta:`Lesson ${k+1} · read here`, st:lessonState(mi,w,k+1)}));
  items.push({kind:'canvas', id:'door-work', title:`Week ${w} Work`, meta:'PDF upload in Canvas', st:turnState(mi,w)});
  items.push({kind:'canvas', id:'door-quiz', title:`Week ${w} Quiz`, meta:'Quiz in Canvas', st:turnState(mi,w)});
  if (w===m.weeks) items.push({kind:'boss', id:'door-project', title:'Module Project', meta:'The keep · Canvas', st:projState(mi)});
  return items;
}
function questList(mi, w, sel){
  return `<ul class="quests">${questItems(mi,w).map((q,i)=>{
    const ic = q.kind==='lesson' ? 's-door' : q.kind==='boss' ? 's-keep' : 's-out';

}
const guideCard = (line, cta) => `<section class="card"><div class="guide"><div class="portrait" aria-hidden="true">L</div>

function sealsCard(){

  }).join('')}</div><div class="sealnames">${MODS.map(m=>`<span>${esc(m.name.replace(/^The /,'').split(' ')[0].replace(/'$/,''))}</span>`).join('')}</div></section>`;
}
function renderSide(){
  const side = document.getElementById('side'), cm = MODS[CUR.m], curRoom = roomName(CUR.m, CUR.w, CUR.l-1);
  if (view.level==='world'){
    side.innerHTML = guideCard(`You left off in ${esc(cm.name)}, Week ${CUR.w}, at ${esc(curRoom)}. What do you remember from your last visit?`,

      `<section class="card"><h2>THIS WEEK</h2><div class="qhead"><div class="title">${esc(cm.name)}</div><div class="sub">Week ${CUR.w}</div></div>${questList(CUR.m, CUR.w)}</section>` + sealsCard();

/* ---------- navigation ---------- */
const view = {level:'world', m:null, w:null, sel:null};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function zoom(svg, to, ms, done){
  const from = svg.getAttribute('viewBox').split(' ').map(Number);
  if (reduce){ svg.setAttribute('viewBox', to.join(' ')); done(); return; }
  const t0 = performance.now();
  (function step(t){
    const p = Math.min(1,(t-t0)/ms), e = p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;
    svg.setAttribute('viewBox', from.map((v,i)=>v+(to[i]-v)*e).join(' '));
    svg.style.opacity = String(1 - Math.max(0,(p-.6)/.4));
    p<1 ? requestAnimationFrame(step) : done();
  })(t0);
}
function show(id, cls){
  ['world','wing','chamber'].forEach(k=>{ const el=document.getElementById(k); el.hidden = k!==id; el.classList.remove('layer-in','layer-back'); el.style.opacity=''; });
  const el = document.getElementById(id); void el.getBoundingClientRect(); el.classList.add(cls); el.setAttribute('viewBox','0 0 1000 680');
}
let busy = false;
function goWing(mi, after){
  if (busy) return; busy = true;
  const m = MODS[mi];
  zoom(document.getElementById('world'), [m.x-150, m.y-110, 300, 204], 700, ()=>{
    renderWing(mi); Object.assign(view,{level:'wing', m:mi, w:null, sel:null}); show('wing','layer-in'); chrome(); busy=false;
    if (after) setTimeout(after, reduce?0:450);
  });
}
function goChamber(w, sel){
  if (busy) return; busy = true;
  const p = nodePositions(MODS[view.m].weeks+1)[w-1];
  zoom(document.getElementById('wing'), [p[0]-110, p[1]-75, 220, 150], 650, ()=>{
    renderChamber(view.m, w); Object.assign(view,{level:'chamber', w, sel:sel||null}); show('chamber','layer-in'); chrome(); busy=false;
  });
}
function toWing(){ renderWing(view.m); Object.assign(view,{level:'wing', w:null, sel:null}); show('wing','layer-back'); chrome(); }
function goWorld(){ renderWorld(); Object.assign(view,{level:'world', m:null, w:null, sel:null}); show('world','layer-back'); chrome(); }
function back(){ if (view.level==='chamber') toWing(); else if (view.level==='wing') goWorld(); }
function continueQuest(){ const go = () => goChamber(CUR.w, 'room-'+CUR.l); if (view.level==='world') goWing(CUR.m, go); }
function chrome(){
  const parts = [view.level==='world' ? `<span class="here">LOBBY</span>` : `<button type="button" data-crumb="world">LOBBY</button>`];
  if (view.level!=='world'){ const nm = esc(MODS[view.m].name.toUpperCase()); parts.push('·', view.level==='wing' ? `<span class="here">${nm}</span>` : `<button type="button" data-crumb="wing">${nm}</button>`); }
  if (view.level==='chamber') parts.push('·', `<span class="here">WEEK ${view.w}</span>`);
  document.getElementById('crumbs').innerHTML = parts.join(' ');
  document.getElementById('backBtn').hidden = view.level==='world';
  renderSide();
  select(defaultTarget());
}

/* ---------- actions ---------- */
let toastTimer;
function toast(head, msg){
  const t = document.getElementById('toast'); t.innerHTML = `<b>${head}</b>${msg}`; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}
function act(mi, w, id){
  const m = MODS[mi];
  if (id.startsWith('room-')){
    const l = +id.slice(5), nm = esc(roomName(mi,w,l-1));
    if (lessonState(mi,w,l)==='locked') return toast('SEALED', `Lesson ${l} · ${nm} opens later.`);
    if (lessonFile(mi,w,l-1)) return openReader(mi,w,l);
    return toast('SAMPLE ROOM', `Real lessons are loaded for Camelot, Week 2. ${nm} would open here.`);
  }
  const what = id==='door-work' ? `Week ${w} Work` : id==='door-quiz' ? `Week ${w} Quiz` : 'Module Project';
  const st = id==='door-project' ? projState(mi) : turnState(mi,w);
  if (st==='locked') return toast('SEALED', `${what} is not open yet.`);
  toast('TO CANVAS', `${what} opens in Canvas in a new tab.`);
}
const stage = document.getElementById('stage');
stage.addEventListener('click', e=>{
  const g = e.target.closest('[data-wing],[data-week],[data-proj],[data-room],[data-door]'); if (!g) return;
  if (g.dataset.wing) return goWing(+g.dataset.wing);
  if (g.dataset.week) return goChamber(+g.dataset.week);
  if (g.dataset.proj) return goChamber(MODS[view.m].weeks, 'door-project');
  select(g); act(view.m, view.w, view.sel);
});
stage.addEventListener('keydown', e=>{
  if ((e.key==='Enter' || e.key===' ') && e.target.closest('[role="button"]')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click',{bubbles:true})); }
});
document.getElementById('side').addEventListener('click', e=>{
  const t = e.target.closest('[data-char]'); if (t) return setChar(t.dataset.char);
  const b = e.target.closest('[data-q]'); if (!b) return;
  if (view.level==='chamber'){
    const q = b.dataset.q, el = document.getElementById('chamber').querySelector(q.startsWith('room-') ? `[data-room="${q.slice(5)}"]` : `[data-door="${q.slice(5)}"]`);
    if (el) select(el); else { view.sel = q; renderSide(); }
  }
  act(+b.dataset.m, +b.dataset.w, b.dataset.q);
});
document.getElementById('crumbs').addEventListener('click', e=>{
  const b = e.target.closest('[data-crumb]'); if (!b) return;
  b.dataset.crumb==='world' ? goWorld() : toWing();
});
document.getElementById('backBtn').addEventListener('click', back);

let charId = 'squire';
try { const v = localStorage.getItem('gl-traveler'); if (CHARS.some(c=>c.id===v)) charId = v; } catch(e){}

/* ---------- lesson reader ---------- */
const reader = document.getElementById('reader'), rTabs = document.getElementById('rTabs'), rBody = document.getElementById('rBody');

function renderReaderTabs(){

/* ---------- keyboard travel: arrows / WASD move, Enter or E goes in, Esc or Q goes back ---------- */
let kbSel = null;
const targets = () => [...document.getElementById(view.level).querySelectorAll('[role="button"]')];
const center = el => { const r = el.getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height/2]; };
function defaultTarget(){
  const svg = document.getElementById(view.level); let q;
  if (view.level==='world') q = `[data-wing="${CUR.m}"]`;
  else if (view.level==='wing') q = view.m===CUR.m ? `[data-week="${CUR.w}"]` : '[data-week="1"]';
  else if (view.sel) q = view.sel.startsWith('room-') ? `[data-room="${view.sel.slice(5)}"]` : `[data-door="${view.sel.slice(5)}"]`;
  else q = (view.m===CUR.m && view.w===CUR.w) ? `[data-room="${CUR.l}"]` : '[data-room="1"]';
  return svg.querySelector(q) || targets()[0];
}
function select(el){
  document.querySelectorAll('.hit.kb').forEach(e=>e.classList.remove('kb'));
  kbSel = el || null; if (!el) return;
  el.classList.add('kb'); el.focus({preventScroll:true}); placeToken(el);
  if (view.level==='chamber'){
    view.sel = el.dataset.room ? 'room-'+el.dataset.room : el.dataset.door ? 'door-'+el.dataset.door : null;
    renderSide();
  }
}
function move(dx, dy){
  const list = targets();
  if (!kbSel || !list.includes(kbSel)) return select(defaultTarget());
  const [x0,y0] = center(kbSel); let best = null, bs = Infinity;
  list.forEach(el=>{
    if (el===kbSel) return;
    const [x,y] = center(el), vx = x-x0, vy = y-y0, along = vx*dx + vy*dy;
    if (along <= 4) return;
    const score = along + Math.abs(vx*dy - vy*dx)*2;
    if (score < bs){ bs = score; best = el; }
  });
  if (best) select(best);
}
document.addEventListener('keydown', e=>{
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target.closest && e.target.closest('input,textarea,select,[contenteditable]')) return;
  const k = e.key.length===1 ? e.key.toLowerCase() : e.key;
  if (!reader.hidden){ if (k==='Escape'){ e.preventDefault(); closeReader(); } return; }
  const dir = {ArrowUp:[0,-1], w:[0,-1], ArrowDown:[0,1], s:[0,1], ArrowLeft:[-1,0], a:[-1,0], ArrowRight:[1,0], d:[1,0]}[k];
  if (dir){ e.preventDefault(); if (!busy) move(dir[0], dir[1]); return; }
  if (k==='Escape' || k==='q'){ if (view.level!=='world' && !busy){ e.preventDefault(); back(); } return; }
  if (k==='e' || ((k==='Enter' || k===' ') && (document.activeElement===document.body || document.activeElement===kbSel))){
    if (kbSel && !busy){ e.preventDefault(); kbSel.dispatchEvent(new MouseEvent('click',{bubbles:true})); }
  }
});

renderStats(); renderWorld(); chrome();
</script>

</body></html>
